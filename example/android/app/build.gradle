plugins {
  id("com.android.application")
  id("com.facebook.react")
}

def bitnetTruthy = { value ->
  if (value == null) {
    return false
  }
  def normalized = value.toString().trim().toLowerCase()
  return normalized == "1" || normalized == "true" || normalized == "yes" || normalized == "on"
}

def bitnetEnableGpu = project.findProperty("ENABLE_GPU") ?:
  project.findProperty("enableGpu") ?:
  System.getenv("ENABLE_GPU") ?:
  "false"
def bitnetAndroidMinSdk = bitnetTruthy(bitnetEnableGpu) ? 28 : 24

react {
  autolinkLibrariesWithApp()
}

android {
  namespace "com.bitnetexample"
  compileSdk 36

  defaultConfig {
    applicationId "com.bitnetexample"
    // Android GPU builds use llama.cpp's Vulkan backend, which links Vulkan 1.1
    // entry points exported by the NDK from API 28. CPU builds retain API 24.
    minSdk bitnetAndroidMinSdk
    targetSdk 36
    versionCode 1
    versionName "1.0"
  }

  ndkVersion "28.2.13676358"

  splits {
    abi {
      reset()
      enable false
    }
  }
}

dependencies {
  implementation("com.facebook.react:react-android")

  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation jscFlavor
  }
}

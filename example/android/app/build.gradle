plugins {
  id("com.android.application")
  id("com.facebook.react")
}

react {
  autolinkLibrariesWithApp()
}

android {
  namespace "com.bitnetexample"
  compileSdk 36

  defaultConfig {
    applicationId "com.bitnetexample"
    // Match the SDK floor: one API level for CPU and optional GPU builds.
    minSdk 28
    targetSdk 36
    versionCode 1
    versionName "1.0"
  }

  ndkVersion "28.2.13676358"

  splits {
    abi {
      reset()
      enable false
    }
  }
}

dependencies {
  implementation("com.facebook.react:react-android")

  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation jscFlavor
  }
}
